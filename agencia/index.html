<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05050a" />

    <title>Sigma — Consultoria, Assessoria e Serviços | Sistemas, sites e marketing digital</title>
    <meta
      name="description"
      content="Sigma — consultoria e agência digital que transforma negócios locais em operações online: catálogos digitais, sites e sistemas sob medida, SaaS, e-commerce, marketplace, consultoria financeira e automação com IA."
    />

    <!-- Open Graph / WhatsApp / Facebook -->
    <!-- Troque https://sigmaconsultoria.com.br pelo domínio real ao publicar -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://sigmaconsultoria.com.br/" />
    <meta property="og:site_name" content="Sigma — Consultoria, Assessoria e Serviços" />
    <meta property="og:title" content="Sigma — Consultoria, Assessoria e Serviços" />
    <meta
      property="og:description"
      content="Catálogos digitais, sites e sistemas sob medida, SaaS, e-commerce, marketplace, consultoria financeira e automação com IA — pra negócios que querem vender mais online."
    />
    <meta property="og:image" content="https://sigmaconsultoria.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sigma — Consultoria, Assessoria e Serviços" />
    <meta
      name="twitter:description"
      content="Catálogos digitais, sites e sistemas sob medida, SaaS, e-commerce, marketplace, consultoria financeira e automação com IA — pra negócios que querem vender mais online."
    />
    <meta name="twitter:image" content="https://sigmaconsultoria.com.br/og-image.png" />
    <!-- Fontes auto-hospedadas via @fontsource, importadas em src/main.tsx.
         Nada de <link> pro Google: aquele stylesheet bloqueia a pintura da
         tela e põe a primeira impressão do site nas mãos de um terceiro. -->

    <!-- Structured data — ajuda o Google a entender que isso é um negócio local -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Sigma — Consultoria, Assessoria e Serviços",
        "description": "Consultoria e agência digital especializada em catálogos digitais, sites e sistemas sob medida, SaaS, e-commerce, marketplace, consultoria financeira e automação com IA para negócios locais.",
        "areaServed": {
          "@type": "City",
          "name": "Goiânia"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Goiânia",
          "addressRegion": "GO",
          "addressCountry": "BR"
        },
        "sameAs": [
          "https://instagram.com/sigma.consultoria",
          "https://linkedin.com/company/sigma-consultoria"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
